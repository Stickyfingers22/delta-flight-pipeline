[project]
name = "delta-pipeline"
version = "0.1.0"
description = "Batch pipeline for BTS on-time performance data, focused on Delta Air Lines"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: runs the full pipeline with dbt (slow, ~30s)"]
filterwarnings = [
    "ignore:sqlglotrs is deprecated:DeprecationWarning",  # inside dagster-dbt's dependency, not our code
    "ignore:Found asset job named:UserWarning",
    "ignore:AssetExecutionContext.op is deprecated:DeprecationWarning",  # inside dagster-dbt
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: errors and unused code, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The dashboard adds src/ to sys.path before importing the package (needed when hosted).
"dashboard/app.py" = ["E402"]
