[project]
name = "delta-pipeline"
version = "0.1.0"
description = "Batch pipeline for BTS on-time performance data, focused on Delta Air Lines"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: runs the full pipeline with dbt (slow, ~30s)"]
