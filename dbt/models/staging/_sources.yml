version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Raw layer written by src/delta_pipeline/ingest.py. Every column is text.
      raw.flights is a view over the Parquet files, created by the create_raw_views
      macro at the start of every dbt run. Nothing is copied.
    tables:
      - name: flights
        description: BTS on-time performance, one Parquet file per month, all carriers.
