# Connection settings. Kept in the repo because DuckDB is a local file with no
# password. With a real warehouse (Snowflake, Databricks) this file would live
# outside the repo and read credentials from environment variables.
delta_flights:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the repo root, where dbt runs. DELTA_WAREHOUSE_PATH overrides it (tests, CI).
      path: "{{ env_var('DELTA_WAREHOUSE_PATH', 'data/warehouse/delta.duckdb') }}"
      threads: 4
